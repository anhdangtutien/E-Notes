services:
  - type: web
    name: e-notes
    env: docker
    plan: free
    region: singapore
    envVars:
      - key: PORT
        value: 8080
      - key: HOST
        value: 0.0.0.0
      - key: ENOTES_DB
        value: /data/enotes.db
    disk:
      name: enotes-data
      mountPath: /data
      sizeGB: 1
