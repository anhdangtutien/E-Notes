[package]
name = "e-notes"
version = "0.1.0"
edition = "2021"
authors = ["E-Notes Team"]
description = "English Learning & Lesson Notebook - Built with Rust"

[[bin]]
name = "enotes"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
rusqlite = { version = "0.32.1", features = ["bundled"] }
chrono = { version = "0.4.45", features = ["serde"] }
